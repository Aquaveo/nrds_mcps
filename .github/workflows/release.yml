name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g., 0.1.0). Must already exist in ghcr.io.'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aquaveo/nrds-mcps

permissions:
  contents: read
  packages: write
  id-token: write

# Serialize deploys so the latestCreatedRevisionName lookup is unambiguous.
concurrency:
  group: cloud-run-deploy-nrds-mcps
  cancel-in-progress: false

jobs:
  release:
    # Build + push only runs on tag pushes; workflow_dispatch re-deploys an existing tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building image for version: $VERSION"

      - name: Setup QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=NRDS MCP Server
            org.opencontainers.image.description=NRDS-specific FastMCP server (S3-backed query, list, chart, hydrofabric tools)
            org.opencontainers.image.vendor=Aquaveo LLC
            org.opencontainers.image.licenses=MIT

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    # Run after release on tag push, OR directly on workflow_dispatch.
    needs: [release]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/43707369422/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: nrds-mcps-deployer@ibis-436806.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Derive version (prefer workflow_dispatch input over ref)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive a non-empty version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Derived version: $VERSION"

      - name: Verify ghcr.io manifest is visible (eventual-consistency guard)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/aquaveo/nrds-mcps:${{ steps.version.outputs.version }}"
          for i in $(seq 1 12); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Manifest visible after ${i} attempts ($((i*5)) s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::ghcr.io manifest not visible after 60 s for $IMAGE"
          exit 1

      - name: Deploy to Cloud Run
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/ibis-436806/nrds-mcps-remote/aquaveo/nrds-mcps:${{ steps.version.outputs.version }}"
          DEPLOY_OUT=$(gcloud run deploy nrds-mcps \
            --image="$IMAGE" \
            --region=us-central1 \
            --port=9000 \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=3600 \
            --concurrency=80 \
            --allow-unauthenticated \
            --set-env-vars=MCP_PORT=9000,MCP_HOST=0.0.0.0,MCP_TRANSPORT=streamable-http,NRDS_LOG_LEVEL=INFO,ALLOWED_ORIGINS='*' \
            --startup-probe=httpGet.path=/health,httpGet.port=9000,initialDelaySeconds=10,timeoutSeconds=5,periodSeconds=5,failureThreshold=12 \
            --format='value(status.url,status.latestCreatedRevisionName)')
          URL=$(echo "$DEPLOY_OUT" | awk '{print $1}')
          REVISION=$(echo "$DEPLOY_OUT" | awk '{print $2}')
          if [ -z "$URL" ] || [ -z "$REVISION" ]; then
            echo "::error::Deploy did not return URL+revision (got URL='$URL' REVISION='$REVISION')"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Deployed revision $REVISION at $URL"

      - name: Smoke /health on the new revision
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "::error::No URL to probe"; exit 1
          fi
          for i in $(seq 1 24); do
            if curl -fsS "$URL/health" > /dev/null; then
              echo "Healthcheck passed after ${i} attempts ($((i*5)) s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Healthcheck did not respond after 120 s"
          gcloud run services logs read nrds-mcps --region=us-central1 --limit=50 || true
          exit 1

      # Stronger gate than /health=200: actually speak MCP-protocol over SSE and
      # verify tools/list returns the expected set. Catches tool-init crashes
      # that leave the HTTP server alive but the tool registry empty/short.
      - name: Setup Python for MCP probe
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fastmcp client
        # Pin to match server's nextgen_mcp/requirements.lock. Bump in lockstep
        # when the server upgrades fastmcp.
        run: pip install 'fastmcp==3.2.4'

      - name: MCP smoke — list tools and assert surface
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
          # Defensive lower bound; the load-bearing assertions below are
          # the explicit name-absence and name-presence checks.
          EXPECTED_MIN_TOOLS: '10'
        run: |
          set -euo pipefail
          python <<'PY'
          import asyncio, os, sys
          from fastmcp import Client

          URL = os.environ["URL"] + "/mcp"
          EXPECTED = int(os.environ["EXPECTED_MIN_TOOLS"])

          # Names that must NOT exist on the deployed server. Listed
          # explicitly because a min-count check alone is a silent
          # false negative — re-introducing a deleted tool would still
          # satisfy `count >= EXPECTED` and let the regression ship.
          REMOVED = (
              "create_plotly_chart_from_output_selector",
              "create_plotly_chart_from_parquet_output_file",
              "build_hydrofabric_feature_map_config",
              "query_hydrofabric_parquet_file",
          )

          # Names that must exist (renamed-and-reshaped surface from
          # the data-only cleanup in v0.2.0).
          REQUIRED = (
              "lookup_hydrofabric_feature",
          )

          # Prompts (slash-command templates) that must exist on the
          # deployed server. Mirrors the REQUIRED tool-name vocabulary
          # above so a regression that drops the @mcp.prompt registration
          # fails the deploy gate instead of shipping silently.
          REQUIRED_PROMPTS = (
              "plot_timeseries",
          )

          async def smoke():
              async with Client(URL) as c:
                  tools = await c.list_tools()
                  prompts = await c.list_prompts()
                  return (
                      [t.name for t in tools],
                      [p.name for p in prompts],
                  )

          try:
              names, prompt_names = asyncio.run(
                  asyncio.wait_for(smoke(), timeout=30)
              )
          except asyncio.TimeoutError:
              print("::error::MCP smoke timed out after 30 s")
              sys.exit(1)

          name_set = set(names)
          count = len(names)
          print(f"tools/list returned {count} tools")
          for name in sorted(names):
              print(f"  - {name}")

          prompt_set = set(prompt_names)
          prompt_count = len(prompt_names)
          print(f"prompts/list returned {prompt_count} prompts")
          for name in sorted(prompt_names):
              print(f"  - {name}")

          failed = False

          present_but_should_not_be = [n for n in REMOVED if n in name_set]
          if present_but_should_not_be:
              for n in present_but_should_not_be:
                  print(
                      f"::error::Removed tool still present in tools/list: {n}. "
                      "v0.2.0 deleted this surface; re-introducing it requires "
                      "updating CHANGELOG and this smoke gate together."
                  )
              failed = True

          missing_but_required = [n for n in REQUIRED if n not in name_set]
          if missing_but_required:
              for n in missing_but_required:
                  print(
                      f"::error::Required tool missing from tools/list: {n}"
                  )
              failed = True

          if count < EXPECTED:
              print(
                  f"::error::tools/list returned {count} tools, "
                  f"expected at least {EXPECTED}"
              )
              failed = True

          if prompt_count < 1:
              print(
                  f"::error::prompts/list returned {prompt_count} prompts, "
                  "expected at least 1"
              )
              failed = True

          missing_prompts = [
              n for n in REQUIRED_PROMPTS if n not in prompt_set
          ]
          if missing_prompts:
              for n in missing_prompts:
                  print(
                      f"::error::Required prompt missing from prompts/list: {n}"
                  )
              failed = True

          if failed:
              sys.exit(1)
          PY

      # DuckDB extension cache lives under HOME (~/.duckdb/extensions/) — Cloud
      # Run's container filesystem is read-only except /tmp, so an unwritable
      # HOME causes "Permission denied: /app/.duckdb" on the first httpfs load
      # and crashes every chart/query tool. Calling one DuckDB-using tool with
      # a deliberately-fake S3 URL forces the httpfs extension to load (which
      # triggers the directory creation) before the bucket-not-found error
      # fires. We assert the error returned does NOT mention the read-only-fs
      # path. A pass means HOME is writable; a fail surfaces the regression at
      # deploy time instead of in the field.
      - name: MCP smoke — DuckDB extension load (read-only-fs guard)
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          python <<'PY'
          import asyncio, os, sys
          from fastmcp import Client
          from fastmcp.exceptions import ToolError

          URL = os.environ["URL"] + "/mcp"
          # Deliberate non-existent bucket — DuckDB still loads httpfs to
          # attempt the request, which is what triggers the bug if HOME is
          # not writable. URL must satisfy query_output_file's regex
          # (^(?:https://|s3://).+\.(?:parquet|nc|nc4)$).
          FAKE_S3 = "s3://nrds-mcps-smoke-nonexistent/x.parquet"

          async def smoke():
              async with Client(URL) as c:
                  return await c.call_tool(
                      "query_output_file",
                      {"s3_url": FAKE_S3, "query": "SELECT 1"},
                  )

          # The tool can either return a result with embedded error text
          # OR raise ToolError. Capture both into a single payload string.
          try:
              result = asyncio.run(asyncio.wait_for(smoke(), timeout=30))
              payload = repr(result)
          except asyncio.TimeoutError:
              print("::error::DuckDB smoke timed out after 30 s")
              sys.exit(1)
          except ToolError as e:
              payload = f"ToolError: {e}"
          except Exception as e:
              payload = f"{type(e).__name__}: {e}"

          print(f"smoke result (first 1000 chars): {payload[:1000]}")

          # Schema-failure guard: if the smoke fails on arg validation, it
          # never reached DuckDB and the read-only-fs check is a no-op. Fail
          # loudly so a future tool-signature change doesn't silently break
          # this gate.
          schema_markers = (
              "validation error", "Missing required argument",
              "Unexpected keyword argument", "missing_argument",
          )
          if any(m.lower() in payload.lower() for m in schema_markers):
              print(
                  "::error::Smoke failed at schema validation, before reaching "
                  "DuckDB. Fix the smoke step's tool arg names."
              )
              sys.exit(1)

          # The bug signature: "/app/.duckdb" or "Permission denied" while
          # creating the extension dir. Either string in the response means
          # the read-only-fs gap regressed.
          BAD_MARKERS = ("/app/.duckdb", "Permission denied")
          for marker in BAD_MARKERS:
              if marker in payload:
                  print(
                      f"::error::DuckDB extension load failed on read-only "
                      f"filesystem (saw {marker!r} in tool response). "
                      f"Check Dockerfile ENV HOME=/tmp."
                  )
                  sys.exit(1)
          print("DuckDB smoke passed — extension load OK on read-only fs")
          PY
