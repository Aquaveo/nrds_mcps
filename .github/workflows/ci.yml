name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nextgen_mcp/requirements.lock

      - name: Install pinned dependencies
        run: pip install -r nextgen_mcp/requirements.lock

      - name: Smoke import
        run: python -c "from nextgen_mcp.mcp_server import mcp; print('Import OK:', mcp.name)"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nrds-mcps:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke — start, hit /health, stop
        run: |
          docker run -d --name nrds-mcps-ci -p 9000:9000 nrds-mcps:ci
          # Poll /health for up to 30 seconds
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "Healthcheck passed after ${i}s"
              docker stop nrds-mcps-ci
              docker rm nrds-mcps-ci
              exit 0
            fi
            sleep 1
          done
          echo "::error::Healthcheck did not respond within 30 seconds"
          docker logs nrds-mcps-ci
          docker stop nrds-mcps-ci || true
          docker rm nrds-mcps-ci || true
          exit 1
